name: Hello World

on:
  workflow_dispatch:

jobs:
  say-hello-inline-bash:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Hello from an inline bash script in a GitHub Action Workflow!"
  say-hello-tow:
    runs-on: ubuntu-22.04
    steps:
      - run: printf("fuck you")
        shell: bash
  use-python:
    runs-on: ubuntu-22.04
    steps:
      - run: print("hello from python")
        shell: python
